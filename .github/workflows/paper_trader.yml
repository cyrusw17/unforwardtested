name: Live Paper Trader Cycle

on:
  schedule:
    # Runs hourly. Forex is closed weekends; the script is a no-op when
    # there's no new intraday price or daily bar to process.
    - cron: '5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-trader-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r paper_trading/requirements.txt

      - name: Initialize state if missing
        run: |
          if [ ! -f live/data/state.json ]; then
            echo "No existing state found, running init_state.py"
            python paper_trading/init_state.py
          fi

      - name: Run trading cycle
        run: python paper_trading/run_cycle.py

      - name: Commit and push updated state
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add docs/live/data/*.json live/data/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: paper trader cycle update [skip ci]"
            git push
          fi
